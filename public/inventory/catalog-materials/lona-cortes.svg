<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Anchos y corte de lona</title><desc id="desc">Diagrama de referencia: un rollo de 310 centímetros puede cortarse en franjas de 107 y 203 centímetros. También muestra rollos de 107 y 207 centímetros.</desc>
  <rect width="720" height="420" rx="32" fill="#f1f5f9"/><text x="360" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#111827">LONA · ANCHO Y CORTE</text>
  <g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><rect x="68" y="91" width="584" height="100" rx="14" fill="#0f766e"/><rect x="68" y="91" width="202" height="100" rx="14" fill="#14b8a6"/><path d="M270 91v100" stroke="#fff" stroke-width="4" stroke-dasharray="8 7"/><text x="169" y="148" fill="#fff" font-size="25">107 cm</text><text x="460" y="148" fill="#fff" font-size="25">203 cm</text><text x="360" y="218" fill="#475569" font-size="15">310 cm de origen · corte longitudinal sugerido</text><rect x="68" y="251" width="210" height="58" rx="12" fill="#dbeafe"/><text x="173" y="287" fill="#1d4ed8" font-size="21">Rollo 107 cm</text><rect x="306" y="251" width="210" height="58" rx="12" fill="#ede9fe"/><text x="411" y="287" fill="#6d28d9" font-size="21">Rollo 207 cm</text><rect x="544" y="251" width="108" height="58" rx="12" fill="#fef3c7"/><text x="598" y="287" fill="#92400e" font-size="18">203 cm*</text></g>
  <rect x="43" y="344" width="634" height="42" rx="21" fill="#111827"/><text x="360" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#fff" letter-spacing="1">*203 cm: CORTE INTERNO DEL ROLLO 310 · CONFIRMAR MEDIDA EN RECEPCIÓN</text>
</svg>
