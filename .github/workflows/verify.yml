name: Verify Visual Corp Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure Vercel Git deployments stay enabled
        run: node -e "const c=require('./vercel.json'); if (c.git?.deploymentEnabled !== true) { console.error('Vercel Git deployments must stay enabled.'); process.exit(1); }"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Verify protected manual access
        run: npm run test:manual-access
      - name: Build production assets
        run: npm run build
